name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts
      - run: python -m pytest -q

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension/dist
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    env:
      SCRAPER_API_KEY: ci-local-smoke-test
      EMBEDDING_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 120
      - run: python3 scripts/smoke_demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm --prefix extension ci
      - run: npx --prefix extension playwright-core install --with-deps chromium
      - run: npm --prefix extension run test:browser
      - run: docker compose down
      - run: docker compose up --wait --wait-timeout 120
      - run: python3 scripts/smoke_demo.py --verify-existing
      - if: always()
        run: docker compose logs && docker compose down --volumes
